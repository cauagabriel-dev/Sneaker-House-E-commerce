<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras - Sneaker House</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Identidade Visual (Idêntica às outras páginas) -->
    <header class="header-principal">
        <div class="header-container">
            <div class="caixa-logo">
                <a href="index.html">
                    <img src="logo.png" alt="Logotipo da Minha Loja - Link para a página inicial" class="logo-img">
                </a>
            </div>
            <nav class="nav-menu" aria-label="Navegação Principal">
                <ul>
                    <li><a href="#">Novidades</a></li>
                    <li><a href="index.html" class="highlight">Masculino</a></li>
                    <li><a href="#">Feminino</a></li>
                    <li><a href="#" class="highlight">Promoções</a></li>
                </ul>
            </nav>
            <div class="carrinho-box">
                <a href="carrinho.html" class="link-carrinho" aria-label="Visualizar carrinho de compras">
                    <span class="icone-carrinho-emoji">🛒</span>
                    <span class="contador-itens">1</span> <!-- Agora mostra 1 item adicionado -->
                </a>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL: CARRINHO DE COMPRAS -->
    <main class="carrinho-container">
        <h1 class="carrinho-titulo">Seu Carrinho de Compras</h1>

        <div class="carrinho-layout">
            
            <!-- Tabela/Lista de Itens no Carrinho -->
            <section class="carrinho-itens">
                <div class="item-carrinho-card">
                    <div class="item-imagem">
                        <img src="tenis1.png" alt="Air Force 1 '07 Masculino">
                    </div>
                    <div class="item-detalhes">
                        <h2>Air Force 1 '07 Masculino</h2>
                        <p class="item-opcao">Tamanho: 40</p>
                        <p class="item-preco-unitario">Preço unitário: R$ 759,99</p>
                    </div>
                    <div class="item-quantidade">
                        <label for="qtd-item-1">Qtd:</label>
                        <input type="number" id="qtd-item-1" value="1" min="1" class="input-qtd" oninput="
                            let total = (759.99 * this.value).toFixed(2).replace('.', ',');
                            document.getElementById('preco-prod').innerText = 'R$ ' + total;
                            document.getElementById('subtotal').innerText = 'R$ ' + total;
                            document.getElementById('total-geral').innerText = 'R$ ' + total;
                        ">
                    </div>
                    <div class="item-subtotal-valor">
                        <span id="preco-prod">R$ 759,99</span>
                    </div>
                    <div class="item-remover">
                        <button class="btn-remover-item" title="Remover produto">❌</button>
                    </div>
                </div>
            </section>

            <!-- Resumo dos Valores e Fechamento do Pedido -->
            <aside class="carrinho-resumo">
                <h2>Resumo do Pedido</h2>
                <div class="resumo-linha">
                    <span>Subtotal</span>
                    <span id="subtotal">R$ 759,99</span>
                </div>
                <div class="resumo-linha">
                    <span>Entrega</span>
                    <span class="frete-gratis">Grátis</span>
                </div>
                <hr class="divisor-resumo">
                <div class="resumo-linha total">
                    <span>Total</span>
                    <span id="total-geral">R$ 759,99</span>
                </div>

                <a href="cadastro.html" class="btn-finalizar-compra" style="text-decoration: none; display: block; text-align: center;">
                    Finalizar Compra
                </a>

                <a href="index.html" class="btn-continuar-comprando">Continuar Comprando</a>
            </aside>
        </div>
    </main>

</body>
</html>
